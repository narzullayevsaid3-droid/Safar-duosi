name: Build APK
on:
  push:
  workflow_dispatch:
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Loyihani yaratish
        run: |
          mkdir -p app/src/main/java/uz/safarduosi app/src/main/res/raw
          cat > settings.gradle <<'EOF_FILE'
          pluginManagement {
              repositories {
                  google()
                  mavenCentral()
                  gradlePluginPortal()
              }
          }
          dependencyResolutionManagement {
              repositories {
                  google()
                  mavenCentral()
              }
          }
          rootProject.name = "SafarDuosi"
          include ':app'
          EOF_FILE
          cat > build.gradle <<'EOF_FILE'
          plugins {
              id 'com.android.application' version '8.2.2' apply false
              id 'org.jetbrains.kotlin.android' version '1.9.22' apply false
          }
          EOF_FILE
          cat > gradle.properties <<'EOF_FILE'
          org.gradle.jvmargs=-Xmx2g
          android.useAndroidX=false
          EOF_FILE
          cat > app/build.gradle <<'EOF_FILE'
          plugins {
              id 'com.android.application'
              id 'org.jetbrains.kotlin.android'
          }

          android {
              namespace 'uz.safarduosi'
              compileSdk 34

              defaultConfig {
                  applicationId "uz.safarduosi"
                  minSdk 21
                  targetSdk 33
                  versionCode 1
                  versionName "1.0"
              }

              compileOptions {
                  sourceCompatibility JavaVersion.VERSION_17
                  targetCompatibility JavaVersion.VERSION_17
              }
              kotlinOptions {
                  jvmTarget = '17'
              }
          }
          EOF_FILE
          cat > app/src/main/AndroidManifest.xml <<'EOF_FILE'
          <?xml version="1.0" encoding="utf-8"?>
          <manifest xmlns:android="http://schemas.android.com/apk/res/android">

              <uses-permission android:name="android.permission.RECEIVE_BOOT_COMPLETED"/>
              <uses-permission android:name="android.permission.FOREGROUND_SERVICE"/>
              <uses-permission android:name="android.permission.WAKE_LOCK"/>

              <application
                  android:label="Safar Duosi"
                  android:theme="@android:style/Theme.Material.Light">

                  <activity android:name=".MainActivity" android:exported="true">
                      <intent-filter>
                          <action android:name="android.intent.action.MAIN"/>
                          <category android:name="android.intent.category.LAUNCHER"/>
                      </intent-filter>
                  </activity>

                  <service
                      android:name=".DuaService"
                      android:exported="false"
                      android:foregroundServiceType="mediaPlayback"/>

                  <receiver android:name=".BootReceiver" android:exported="true">
                      <intent-filter android:priority="999">
                          <action android:name="android.intent.action.BOOT_COMPLETED"/>
                          <action android:name="android.intent.action.QUICKBOOT_POWERON"/>
                          <action android:name="com.htc.intent.action.QUICKBOOT_POWERON"/>
                          <action android:name="android.intent.action.ACTION_POWER_CONNECTED"/>
                          <action android:name="android.intent.action.LOCKED_BOOT_COMPLETED"/>
                          <action android:name="com.microntek.acc.on"/>
                          <action android:name="com.syu.acc.on"/>
                          <action android:name="com.android.action.ACC_ON"/>
                          <action android:name="android.intent.action.ACC_ON"/>
                      </intent-filter>
                  </receiver>
              </application>
          </manifest>
          EOF_FILE
          cat > app/src/main/java/uz/safarduosi/BootReceiver.kt <<'EOF_FILE'
          package uz.safarduosi

          import android.content.BroadcastReceiver
          import android.content.Context
          import android.content.Intent
          import android.os.Build

          class BootReceiver : BroadcastReceiver() {
              override fun onReceive(ctx: Context, intent: Intent) {
                  val svc = Intent(ctx, DuaService::class.java)
                  if (Build.VERSION.SDK_INT >= 26) ctx.startForegroundService(svc) else ctx.startService(svc)
              }
          }
          EOF_FILE
          cat > app/src/main/java/uz/safarduosi/DuaService.kt <<'EOF_FILE'
          package uz.safarduosi

          import android.app.Notification
          import android.app.NotificationChannel
          import android.app.NotificationManager
          import android.app.Service
          import android.content.Intent
          import android.media.MediaPlayer
          import android.os.Build
          import android.os.Handler
          import android.os.IBinder
          import android.os.Looper
          import android.speech.tts.TextToSpeech
          import android.speech.tts.UtteranceProgressListener
          import java.util.Locale

          class DuaService : Service() {

              private var player: MediaPlayer? = null
              private var tts: TextToSpeech? = null
              private val handler = Handler(Looper.getMainLooper())
              private var started = false

              private val duaText =
                  "سُبْحَانَ الَّذِي سَخَّرَ لَنَا هَذَا وَمَا كُنَّا لَهُ مُقْرِنِينَ وَإِنَّا إِلَى رَبِّنَا لَمُنقَلِبُونَ"

              override fun onBind(intent: Intent?): IBinder? = null

              override fun onStartCommand(intent: Intent?, flags: Int, startId: Int): Int {
                  startForeground(1, buildNotification())
                  if (!started) {
                      started = true
                      handler.postDelayed({ playDua() }, 3000) // 3 soniya
                  }
                  return START_NOT_STICKY
              }

              private fun buildNotification(): Notification {
                  val nm = getSystemService(NOTIFICATION_SERVICE) as NotificationManager
                  if (Build.VERSION.SDK_INT >= 26) {
                      nm.createNotificationChannel(
                          NotificationChannel("dua", "Safar duosi", NotificationManager.IMPORTANCE_LOW)
                      )
                  }
                  val b = if (Build.VERSION.SDK_INT >= 26) Notification.Builder(this, "dua")
                  else Notification.Builder(this)
                  return b.setContentTitle("Safar duosi")
                      .setSmallIcon(android.R.drawable.ic_media_play)
                      .build()
              }

              private fun playDua() {
                  val id = resources.getIdentifier("dua", "raw", packageName)
                  if (id != 0) {
                      player = MediaPlayer.create(this, id)
                      if (player != null) {
                          player!!.setOnCompletionListener { stopSelf() }
                          player!!.start()
                          return
                      }
                  }
                  // dua.mp3 qo'yilmagan bo'lsa: telefon ovozi (TTS) bilan o'qiydi
                  tts = TextToSpeech(this) { status ->
                      if (status == TextToSpeech.SUCCESS) {
                          tts?.language = Locale("ar")
                          tts?.setOnUtteranceProgressListener(object : UtteranceProgressListener() {
                              override fun onStart(utteranceId: String?) {}
                              override fun onDone(utteranceId: String?) { stopSelf() }
                              override fun onError(utteranceId: String?) { stopSelf() }
                          })
                          tts?.speak(duaText, TextToSpeech.QUEUE_FLUSH, null, "dua")
                      } else {
                          stopSelf()
                      }
                  }
              }

              override fun onDestroy() {
                  handler.removeCallbacksAndMessages(null)
                  player?.release()
                  tts?.shutdown()
                  super.onDestroy()
              }
          }
          EOF_FILE
          cat > app/src/main/java/uz/safarduosi/MainActivity.kt <<'EOF_FILE'
          package uz.safarduosi

          import android.app.Activity
          import android.content.Intent
          import android.os.Build
          import android.os.Bundle
          import android.view.Gravity
          import android.widget.Button
          import android.widget.LinearLayout
          import android.widget.TextView

          class MainActivity : Activity() {
              override fun onCreate(savedInstanceState: Bundle?) {
                  super.onCreate(savedInstanceState)
                  val layout = LinearLayout(this).apply {
                      orientation = LinearLayout.VERTICAL
                      gravity = Gravity.CENTER
                      setPadding(48, 48, 48, 48)
                  }
                  val info = TextView(this).apply {
                      text = "Safar duosi o'rnatildi.\nMashina yonganda 3 soniyadan keyin duo o'qiladi.\n\nAutostart ruxsatini yoqing."
                      textSize = 20f
                      gravity = Gravity.CENTER
                  }
                  val btn = Button(this).apply {
                      text = "Sinab ko'rish"
                      setOnClickListener {
                          val svc = Intent(this@MainActivity, DuaService::class.java)
                          if (Build.VERSION.SDK_INT >= 26) startForegroundService(svc) else startService(svc)
                      }
                  }
                  layout.addView(info)
                  layout.addView(btn)
                  setContentView(layout)
              }
          }
          EOF_FILE
          if [ -f dua.mp3 ]; then cp dua.mp3 app/src/main/res/raw/dua.mp3; fi
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
      - uses: gradle/actions/setup-gradle@v3
        with:
          gradle-version: 8.5
      - run: gradle assembleDebug --no-daemon
      - uses: actions/upload-artifact@v4
        with:
          name: SafarDuosi-APK
          path: app/build/outputs/apk/debug/app-debug.apk
